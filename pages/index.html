<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <title>instalador nixos — URL curta</title>
</head>
<body>
  <h1>Instalador NixOS (lafco)</h1>
  <p>Na ISO minimal, rode <strong>uma</strong> linha:</p>
  <pre><code>curl -Ls https://lafco.github.io/i | sh</code></pre>
  <p><code>/i</code> é um bootstrap estático: baixa e executa a versão mais
  nova do instalador de <a href="https://github.com/lafco/nixos">lafco/nixos</a>
  (<code>install/install-iso.sh</code>).</p>
</body>
</html>
