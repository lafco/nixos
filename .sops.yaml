# Regras de criação de segredos do sops-nix.
#
# 1. Sua chave age (máquina do trabalho e edição local):
#      mkdir -p ~/.config/sops/age && age-keygen -o ~/.config/sops/age/keys.txt
# 2. Chave do host daily/server (decripta no próprio servidor):
#      ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub   (rodado NA máquina)
# 3. Substitua os placeholders abaixo pelas chaves públicas (age1...).
keys:
  - &lafco age1_SUBSTITUA_PELA_SUA_CHAVE_AGE
  - &daily_host age1_SUBSTITUA_PELO_SSH_TO_AGE_DA_DAILY
  - &server_host age1_SUBSTITUA_PELO_SSH_TO_AGE_DO_SERVER

creation_rules:
  - path_regex: ^secrets/secrets\.yaml$
    key_groups:
      - age:
          - *lafco
          - *daily_host
          - *server_host
